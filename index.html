<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#101b28">
  <meta name="description" content="Tóm tắt công khai layout Phòng 2 · Giao Ước Máu: Asylum">
  <title>Giao Ước Máu: Asylum · Room 2 Layout v0.1</title>
  <style>
    :root { color-scheme:dark; font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; background:#101b28; color:#eef5f2; }
    * { box-sizing:border-box; }
    body { margin:0; background:radial-gradient(ellipse 90% 420px at 85% 0%,#254551,transparent 75%),#101b28; }
    main { max-width:980px; margin:auto; padding:45px 22px 72px; }
    .eyebrow { color:#89edcf; font-size:.75rem; font-weight:800; letter-spacing:.12em; text-transform:uppercase; }
    h1 { font:500 clamp(2.5rem,8vw,4.4rem)/1 Georgia,serif; letter-spacing:-.05em; margin:18px 0 12px; }
    h1 em { display:block; color:#a5f1d3; font-style:normal; }
    .subtitle { max-width:720px; margin:0 0 8px; color:#d2e0de; font-size:.9rem; line-height:1.55; }
    .version { color:#b7c8c8; margin:0 0 14px; font-size:.82rem; }
    .notice { margin:0 0 17px; padding:10px 13px; border-left:3px solid #ffd591; background:#ffd5910e; color:#e5d4b5; font-size:.78rem; line-height:1.55; }
    .legend { display:flex; flex-wrap:wrap; gap:8px 18px; margin:0 0 28px; color:#b7c8c8; font-size:.76rem; }
    .legend span { display:inline-flex; align-items:center; gap:7px; }
    .dot { width:11px; height:11px; border-radius:50%; background:#9eabb1; }
    .dot.locked { background:#5cdaad; }
    .dot.stable { background:#75bfff; }
    .tabs { display:flex; gap:8px; margin:0 0 26px; border-bottom:1px solid #354955; }
    .tab { padding:10px 13px; border:0; border-bottom:2px solid transparent; color:#b7c8c8; background:transparent; cursor:pointer; }
    .tab[aria-selected="true"] { color:#a4f1d4; border-color:#a4f1d4; }
    .tab:focus-visible { outline:2px solid #9df6d8; outline-offset:2px; }
    .tab-panel[hidden] { display:none; }
    section { margin:0 0 27px; }
    section.feature { border:2px solid #a4f1d4; border-radius:16px; padding:10px 15px; background:linear-gradient(110deg,#1d4145,#172b37); }
    h2 { margin:0 0 8px; color:#b8d7d4; font-size:.8rem; letter-spacing:.08em; text-transform:uppercase; }
    .row { border-bottom:1px solid #354955; }
    .row:last-child,.feature .row { border:0; }
    .row-head { display:grid; grid-template-columns:12px minmax(120px,165px) 1fr 24px; align-items:center; gap:10px; padding:12px 4px; line-height:1.5; list-style:none; }
    .row-head:not(.expandable) { grid-template-columns:12px minmax(120px,165px) 1fr; }
    summary { cursor:pointer; }
    summary::-webkit-details-marker { display:none; }
    summary:hover { background:#ffffff0b; }
    summary:focus-visible { outline:2px solid #9df6d8; outline-offset:2px; }
    .keyword { color:#ffd591; }
    .feature .keyword { color:#a4f1d4; }
    .brief { color:#e1eeeb; }
    .more { margin:-2px 0 12px 197px; color:#b7c8c8; font-size:.82rem; line-height:1.55; }
    .more p { margin:0 0 7px; }
    .expand { display:grid; place-items:center; width:22px; height:22px; border-radius:5px; background:#ffffff12; color:#a4f1d4; }
    details[open] .expand { background:#ffffff2a; }
    .plan-card { margin:0 0 28px; overflow:hidden; border:1px solid #354955; border-radius:14px; background:#132633; }
    .plan-head { display:flex; justify-content:space-between; gap:12px; padding:13px 15px; border-bottom:1px solid #354955; }
    .plan-head strong { color:#a4f1d4; font-size:.84rem; }
    .plan-head span { color:#a7bfc0; font-size:.76rem; }
    .plan-wrap { padding:12px; }
    svg { display:block; width:100%; height:auto; border-radius:8px; background:#0f202b; }
    .grid { stroke:#ffffff0b; stroke-width:1; }
    .room { fill:#9ee2e50a; stroke:#dce8e5; stroke-width:8; }
    .room.attached { stroke:#a4f1d4; }
    .gm { fill:#d0b5f710; stroke:#d0b5f7; }
    .room-name { fill:#eef5f2; font-size:19px; font-weight:800; text-anchor:middle; }
    .room-note { fill:#a9bdbc; font-size:14px; text-anchor:middle; }
    .route { fill:none; stroke:#72ddd1; stroke-width:10; stroke-linecap:round; stroke-dasharray:18 12; opacity:.9; marker-end:url(#player-arrow); }
    .staff { stroke:#d0b5f7; stroke-width:8; stroke-dasharray:14 9; marker-end:url(#staff-arrow); }
    .staff-label { fill:#d0b5f7; font-size:13px; font-weight:700; text-anchor:middle; }
    .route-label { fill:#72ddd1; font-size:14px; font-weight:750; text-anchor:middle; }
    .draft-note { fill:#ffd591; font-size:13px; font-weight:700; text-anchor:middle; }
    .measured-plan .hall { fill:#72ddd126; stroke:#72ddd1; stroke-width:3; }
    .measured-plan .measured-room { fill:#172b37; stroke:#dce8e5; stroke-width:5; }
    .measured-plan .measure { stroke:#ffd591; stroke-width:2; marker-start:url(#measure-arrow); marker-end:url(#measure-arrow); }
    .measured-plan .measure-guide { stroke:#ffd59188; stroke-width:1; stroke-dasharray:5 4; }
    .measured-plan .measure-text { fill:#ffd591; font-size:16px; font-weight:750; text-anchor:middle; paint-order:stroke; stroke:#0f202b; stroke-width:5; }
    .measured-plan .area-text { fill:#a4f1d4; font-size:16px; font-weight:750; text-anchor:middle; }
    .area-cards { display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:10px; margin:0 0 24px; }
    .area-card { padding:13px; border:1px solid #354955; border-radius:10px; background:#132633; }
    .area-card strong { display:block; color:#a4f1d4; font-size:.8rem; }
    .area-card b { display:block; margin:5px 0 2px; font:500 1.65rem/1 Georgia,serif; color:#eef5f2; }
    .area-card span { color:#a7bfc0; font-size:.73rem; }
    .formula { display:grid; grid-template-columns:minmax(120px,165px) minmax(0,1fr) 75px; gap:10px; padding:10px 4px; border-bottom:1px solid #354955; font-size:.82rem; line-height:1.45; }
    .formula strong { color:#ffd591; }
    .formula output { color:#a4f1d4; font-weight:800; text-align:right; }
    .check { margin:12px 0 0; padding:10px 12px; border:1px solid #75bfff; border-radius:8px; color:#cce6ff; background:#75bfff10; font-size:.82rem; }
    footer { border-top:1px solid #354955; padding-top:18px; color:#b7c8c8; font-size:.8rem; line-height:1.55; }
    @media (max-width:560px) {
      main { padding:28px 18px 60px; }
      .row-head,.row-head:not(.expandable) { grid-template-columns:12px 1fr 24px; gap:2px 9px; }
      .keyword { grid-column:2; }
      .brief { grid-column:2; grid-row:2; }
      .expand { grid-column:3; grid-row:1/3; }
      .more { margin-left:31px; }
      .plan-head { display:block; }
      .plan-head span { display:block; margin-top:3px; }
      .tabs { overflow-x:auto; }
      .tab { flex:0 0 auto; }
      .area-cards { grid-template-columns:1fr; }
      .formula { grid-template-columns:1fr auto; }
      .formula span { grid-column:1/-1; grid-row:2; }
    }
    @media print {
      :root { color-scheme:light; background:#fff; color:#111; }
      body { background:#fff; }
      main { max-width:none; padding:10mm; }
      .plan-card,section { break-inside:avoid; }
    }
  </style>
</head>
<body>
  <main id="summary"><noscript>Cần bật JavaScript để xem tóm tắt layout Phòng 2.</noscript></main>
  <script src="room-2-layout-data.js"></script>
  <script>
    // Display only. Versioned content and conceptual geometry live in adjacent data-only JS.
    (() => {
      const data = window.room2Layout;
      const root = document.getElementById('summary');
      const NS = 'http://www.w3.org/2000/svg';
      function add(parent, tag, className, text) {
        const node = document.createElement(tag);
        if (className) node.className = className;
        if (text !== undefined) node.textContent = text;
        parent.append(node);
        return node;
      }
      function svgAdd(parent, tag, attributes = {}, text) {
        const node = document.createElementNS(NS, tag);
        Object.entries(attributes).forEach(([key,value]) => node.setAttribute(key,value));
        if (text !== undefined) node.textContent = text;
        parent.append(node);
        return node;
      }
      function row(parent, item) {
        const wrapper = add(parent, 'div', 'row');
        const expandable = Boolean(item.details?.length);
        const panel = add(wrapper, expandable ? 'details' : 'div');
        const head = add(panel, expandable ? 'summary' : 'div', expandable ? 'row-head expandable' : 'row-head');
        const dot = add(head, 'span', `dot ${item.status}`);
        dot.title = data.statusLegend[item.status];
        dot.setAttribute('aria-label', data.statusLegend[item.status]);
        dot.setAttribute('role', 'img');
        add(head, 'strong', 'keyword', item.keyword);
        add(head, 'span', 'brief', item.brief);
        if (expandable) {
          const expand = add(head, 'span', 'expand', '…');
          expand.title = data.labels.expand;
          expand.setAttribute('aria-hidden', 'true');
          const more = add(panel, 'div', 'more');
          item.details.forEach(detail => add(more, 'p', '', detail));
        }
      }
      function renderPlan(parent) {
        const card = add(parent, 'figure', 'plan-card');
        const head = add(card, 'figcaption', 'plan-head');
        add(head, 'strong', '', data.labels.diagram);
        add(head, 'span', '', data.labels.diagramNote);
        const wrap = add(card, 'div', 'plan-wrap');
        const svg = svgAdd(wrap, 'svg', { viewBox:'0 0 1000 710', role:'img', 'aria-label':`${data.labels.diagram}. ${data.labels.diagramNote}` });
        const defs = svgAdd(svg, 'defs');
        const pattern = svgAdd(defs, 'pattern', { id:'grid', width:50, height:50, patternUnits:'userSpaceOnUse' });
        svgAdd(pattern, 'path', { d:'M 50 0 L 0 0 0 50', class:'grid', fill:'none' });
        [['player-arrow','#72ddd1'],['staff-arrow','#d0b5f7']].forEach(([id,color]) => {
          const marker = svgAdd(defs, 'marker', { id, viewBox:'0 0 10 10', refX:8, refY:5, markerWidth:6, markerHeight:6, orient:'auto-start-reverse' });
          svgAdd(marker, 'path', { d:'M 0 0 L 10 5 L 0 10 z', fill:color });
        });
        svgAdd(svg, 'rect', { width:1000, height:710, fill:'url(#grid)' });
        data.plan.playerRoutes.forEach(route => svgAdd(svg, 'path', { d:route.d, class:'route' }));
        svgAdd(svg, 'text', { x:500, y:686, class:'route-label' }, data.labels.playerRoute);
        data.plan.rooms.forEach(room => {
          svgAdd(svg, 'rect', { x:room.x, y:room.y, width:room.width, height:room.height, rx:room.kind === 'gm' ? 6 : 2, class:`room ${room.kind === 'gm' ? 'gm' : room.kind}` });
          const centerX = room.x + room.width / 2;
          const centerY = room.y + room.height / 2;
          svgAdd(svg, 'text', { x:centerX, y:centerY-4, class:'room-name' }, room.name);
          svgAdd(svg, 'text', { x:centerX, y:centerY+22, class:'room-note' }, room.note);
        });
        data.plan.staffAccess.forEach(access => {
          svgAdd(svg, 'line', { x1:access.from[0], y1:access.from[1], x2:access.to[0], y2:access.to[1], class:'staff' });
        });
        svgAdd(svg, 'text', { x:500, y:330, class:'staff-label' }, data.labels.staffAccess);
        svgAdd(svg, 'text', { x:500, y:355, class:'draft-note' }, data.labels.diagramNote);
        return card;
      }
      function renderMeasuredPlan(parent) {
        const draft = data.measurementDraft;
        const geometry = draft.geometry;
        const scale = 100;
        const origin = [80,80];
        const card = add(parent, 'figure', 'plan-card');
        const head = add(card, 'figcaption', 'plan-head');
        add(head, 'strong', '', draft.labels.plan);
        add(head, 'span', '', draft.labels.planNote);
        const wrap = add(card, 'div', 'plan-wrap');
        const svg = svgAdd(wrap, 'svg', { viewBox:'0 0 1160 760', class:'measured-plan', role:'img', 'aria-label':draft.labels.planAria });
        const defs = svgAdd(svg, 'defs');
        const pattern = svgAdd(defs, 'pattern', { id:'measured-grid', width:50, height:50, patternUnits:'userSpaceOnUse' });
        svgAdd(pattern, 'path', { d:'M 50 0 L 0 0 0 50', class:'grid', fill:'none' });
        const measureMarker = svgAdd(defs, 'marker', { id:'measure-arrow', viewBox:'0 0 10 10', refX:5, refY:5, markerWidth:5, markerHeight:5, orient:'auto-start-reverse' });
        svgAdd(measureMarker, 'path', { d:'M 10 0 L 0 5 L 10 10', fill:'#ffd591' });
        const routeMarker = svgAdd(defs, 'marker', { id:'measured-route-arrow', viewBox:'0 0 10 10', refX:8, refY:5, markerWidth:5, markerHeight:5, orient:'auto' });
        svgAdd(routeMarker, 'path', { d:'M 0 0 L 10 5 L 0 10 z', fill:'#72ddd1' });
        svgAdd(svg, 'rect', { width:1160, height:760, fill:'url(#measured-grid)' });
        const shellWidth = geometry.shell.width * scale;
        const shellHeight = geometry.shell.height * scale;
        svgAdd(svg, 'rect', { x:origin[0], y:origin[1], width:shellWidth, height:shellHeight, class:'hall' });
        geometry.rooms.forEach(room => {
          const x = origin[0] + room.x * scale;
          const y = origin[1] + room.y * scale;
          const width = room.width * scale;
          const height = room.height * scale;
          svgAdd(svg, 'rect', { x, y, width, height, class:'measured-room' });
          svgAdd(svg, 'text', { x:x+width/2, y:y+height/2-20, class:'room-name' }, room.name);
          svgAdd(svg, 'text', { x:x+width/2, y:y+height/2+12, class:'room-note' }, `${room.width.toFixed(1)} × ${room.height.toFixed(1)} m`);
          svgAdd(svg, 'text', { x:x+width/2, y:y+height/2+42, class:'area-text' }, `${room.area.toFixed(2)} m²`);
        });
        const route = 'M120 640 L120 120 L350 120 Q540 120 540 300 L540 520 Q540 640 350 640 L120 640 M540 300 Q540 120 730 120 L1040 120 L1040 640 L730 640 Q540 640 540 520';
        svgAdd(svg, 'path', { d:route, class:'route', 'marker-end':'url(#measured-route-arrow)' });
        function measure(x1,y1,x2,y2,label,textX,textY) {
          svgAdd(svg, 'line', { x1,y1,x2,y2,class:'measure' });
          svgAdd(svg, 'text', { x:textX, y:textY, class:'measure-text' }, label);
        }
        svgAdd(svg, 'line', { x1:80,y1:80,x2:80,y2:38,class:'measure-guide' });
        svgAdd(svg, 'line', { x1:1080,y1:80,x2:1080,y2:38,class:'measure-guide' });
        measure(80,42,1080,42,'10,0 m',580,30);
        svgAdd(svg, 'line', { x1:80,y1:80,x2:38,y2:80,class:'measure-guide' });
        svgAdd(svg, 'line', { x1:80,y1:680,x2:38,y2:680,class:'measure-guide' });
        measure(42,80,42,680,'6,0 m',23,386);
        measure(80,720,160,720,'0,8 m',120,744);
        measure(540,380,620,380,'0,8 m',580,368);
        svgAdd(svg, 'text', { x:580, y:720, class:'route-label' }, draft.labels.hallwayTotal);
        return card;
      }
      function renderMeasuredDraft(parent) {
        const draft = data.measurementDraft;
        renderMeasuredPlan(parent);
        const cards = add(parent, 'div', 'area-cards');
        draft.areaCards.forEach(item => {
          const card = add(cards, 'div', 'area-card');
          add(card, 'strong', '', item.label);
          add(card, 'b', '', item.value);
          add(card, 'span', '', item.note);
        });
        const report = add(parent, 'section');
        add(report, 'h2', '', draft.labels.report);
        draft.report.forEach(item => row(report, item));
        const calculations = add(parent, 'section');
        add(calculations, 'h2', '', draft.labels.calculations);
        draft.calculations.forEach(item => {
          const line = add(calculations, 'div', 'formula');
          add(line, 'strong', '', item.keyword);
          add(line, 'span', '', item.brief);
          add(line, 'output', '', `${item.value.toFixed(2).replace('.', ',')} m²`);
        });
        add(calculations, 'p', 'check', draft.check);
        const assumptions = add(parent, 'section');
        add(assumptions, 'h2', '', draft.labels.assumptions);
        row(assumptions, { keyword:draft.labels.assumptionKeyword, brief:draft.labels.assumptionBrief, status:'draft', details:draft.assumptions });
        add(parent, 'footer', '', draft.footer);
      }
      if (!data) return;
      root.replaceChildren();
      const eyebrow = add(root, 'div', 'eyebrow');
      const title = add(root, 'h1');
      const titleMain = add(title, 'span');
      const titleAccent = add(title, 'em');
      const subtitle = add(root, 'p', 'subtitle');
      const version = add(root, 'p', 'version');
      const notice = add(root, 'p', 'notice');
      const legend = add(root, 'div', 'legend');
      Object.entries(data.statusLegend).forEach(([status,label]) => {
        const item = add(legend, 'span');
        add(item, 'i', `dot ${status}`);
        add(item, 'span', '', label);
      });
      const tabs = add(root, 'nav', 'tabs');
      tabs.setAttribute('aria-label', data.labels.tabs);
      tabs.setAttribute('role', 'tablist');
      const panels = new Map();
      const buttons = new Map();
      data.tabs.forEach(item => {
        const button = add(tabs, 'button', 'tab', item.label);
        button.type = 'button';
        button.id = `tab-${item.id}`;
        button.setAttribute('role', 'tab');
        button.setAttribute('aria-controls', `panel-${item.id}`);
        button.addEventListener('click', () => { location.hash = item.id; });
        buttons.set(item.id, button);
        const panel = add(root, 'div', 'tab-panel');
        panel.id = `panel-${item.id}`;
        panel.setAttribute('role', 'tabpanel');
        panel.setAttribute('aria-labelledby', button.id);
        panels.set(item.id, panel);
      });
      const summaryPanel = panels.get('summary');
      const feature = add(summaryPanel, 'section', 'feature');
      row(feature, data.feature);
      renderPlan(summaryPanel);
      data.sections.forEach(section => {
        const group = add(summaryPanel, 'section');
        add(group, 'h2', '', section.title);
        section.rows.forEach(item => row(group, item));
      });
      add(summaryPanel, 'footer', '', data.footer);
      renderMeasuredDraft(panels.get('measured-draft'));
      function selectTab() {
        const requested = location.hash.slice(1);
        const active = panels.has(requested) ? requested : 'summary';
        panels.forEach((panel,id) => { panel.hidden = id !== active; });
        buttons.forEach((button,id) => {
          button.setAttribute('aria-selected', id === active ? 'true' : 'false');
          button.tabIndex = id === active ? 0 : -1;
        });
        const view = active === 'measured-draft' ? data.measurementDraft : data;
        eyebrow.textContent = view.eyebrow;
        titleMain.textContent = view.heading[0];
        titleAccent.textContent = view.heading[1];
        subtitle.textContent = view.subtitle;
        version.textContent = `${data.version} · ${active === 'measured-draft' ? data.measurementDraft.labels.version : data.labels.summaryVersion}`;
        notice.textContent = view.notice;
        document.title = active === 'measured-draft' ? view.title : data.title;
      }
      window.addEventListener('hashchange', selectTab);
      selectTab();
    })();
  </script>
</body>
</html>
