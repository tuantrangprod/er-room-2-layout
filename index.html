<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="theme-color" content="#101b28">
<title>Room 2 Layout v0.3</title>
<style>
:root{font-family:system-ui,-apple-system,"Segoe UI",sans-serif;color:#eef5f2;background:#101b28;color-scheme:dark}*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse 90% 420px at 85% 0%,#254551,transparent 75%),#101b28}main{max-width:1180px;margin:auto;padding:38px 22px 60px}.eyebrow{color:#89edcf;font-size:.75rem;font-weight:800;letter-spacing:.12em;text-transform:uppercase}h1{font:500 clamp(2.4rem,7vw,4rem)/1.05 Georgia,serif;letter-spacing:-.04em;margin:15px 0 10px}header p,footer{color:#b7c8c8;line-height:1.55}.notice{padding:11px 14px;border-left:3px solid #ffd591;background:#ffd59110;color:#e5d4b5}.tabs{display:flex;overflow-x:auto;gap:7px;margin:24px 0;border-bottom:1px solid #354955}.tab{flex:none;padding:11px 13px;border:0;border-bottom:2px solid transparent;background:transparent;color:#b7c8c8;cursor:pointer}.tab[aria-selected=true]{color:#a4f1d4;border-color:#a4f1d4}.tab:focus-visible,.card:focus-visible{outline:2px solid #9df6d8;outline-offset:2px}.panel[hidden]{display:none}.overview-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:14px}.card{display:block;padding:9px;border:1px solid #354955;border-radius:12px;background:#132633;cursor:pointer}.card svg{display:block;width:100%;height:155px;background:#0f202b;border-radius:7px}.draft-status{display:inline-block;padding:5px 9px;border:1px solid #ffd59166;border-radius:99px;color:#ffd591;font-size:.8rem}.brief{max-width:760px;line-height:1.5;color:#d2e0de}.config,.areas{display:grid;grid-template-columns:repeat(auto-fit,minmax(155px,1fr));gap:9px;margin:18px 0}.field,.area{padding:11px;border:1px solid #354955;border-radius:9px;background:#132633}.field span,.area span{display:block;color:#a7bfc0;font-size:.74rem}.field strong,.area strong{display:block;margin-top:6px;font-size:.95rem;overflow-wrap:anywhere}.workspace{display:grid;grid-template-columns:minmax(0,1fr) 200px;gap:12px;align-items:start}.plan{margin:0;padding:10px;border:1px solid #354955;border-radius:12px;background:#132633;overflow-x:auto}.plan svg{display:block;width:100%;min-width:530px;height:auto;background:#0f202b}.layers{padding:13px;border:1px solid #354955;border-radius:10px;background:#132633}.layers h3{margin:0 0 10px}.layers label{display:flex;gap:8px;align-items:center;margin:9px 0;font-size:.82rem}.layers input{accent-color:#5cdaad}.measure-line{stroke:#ffd591;stroke-width:.018;stroke-dasharray:.07 .05}.measure-text{fill:#ffd591;font-size:16px}.room-shape{fill:#183540}.hall-shape{fill:#72ddd124}.wall-shape{fill:#dce8e5}.room-name{fill:#eef5f2;font-size:18px;text-anchor:middle;font-weight:700}.area{min-width:0}.report{margin:22px 0}.report li{padding:9px;border-bottom:1px solid #354955;color:#dce8e5}.warning{margin:9px 0;padding:11px 13px;border-left:3px solid #ffb454;background:#ffb45412;color:#f2d4aa;line-height:1.5}details{margin:16px 0;padding:13px;border:1px solid #354955;border-radius:9px;background:#132633}details li{margin:8px 0;color:#c5d2d1;line-height:1.5}footer{margin-top:25px;border-top:1px solid #354955;padding-top:14px}.layer-measurements[hidden],.layer-rooms[hidden],.layer-main[hidden],.layer-sub[hidden],.layer-walls[hidden]{display:none!important}@media(max-width:650px){main{padding:25px 16px}.workspace{grid-template-columns:1fr}.overview-grid{grid-template-columns:repeat(2,minmax(0,1fr))}.card svg{height:125px}}@media print{body,:root{background:#fff!important;color:#111!important;color-scheme:light}main{max-width:none;padding:8mm}.tabs,.layers,.overview-grid{display:none!important}.panel[hidden]{display:block!important}.plan,.field,.area,details{break-inside:avoid;background:#fff;border-color:#aaa}.plan svg{min-width:0}.warning{color:#623800;background:#fff5e5}header p,footer{color:#333}}
</style>
</head>
<body><main id="app"><noscript>JavaScript is required to display this report.</noscript></main>
<script src="room-2-layout-data.js"></script>
<script>
(()=>{'use strict';const data=window.room2Layout,root=document.getElementById('app'),NS='http://www.w3.org/2000/svg';if(!data)return;const el=(tag,cls,text,parent)=>{const n=document.createElement(tag);if(cls)n.className=cls;if(text!==undefined)n.textContent=text;if(parent)parent.append(n);return n};const svgEl=(tag,attrs,parent,text)=>{const n=document.createElementNS(NS,tag);Object.entries(attrs).forEach(([k,v])=>n.setAttribute(k,v));if(text!==undefined)n.textContent=text;if(parent)parent.append(n);return n};const tabs=el('nav','tabs',undefined,root);tabs.setAttribute('role','tablist');tabs.setAttribute('aria-label','Room layout views');const panels=new Map(),buttons=new Map();function select(id){const active=panels.has(id)?id:'overview';for(const[k,p]of panels)p.hidden=k!==active;for(const[k,b]of buttons){b.setAttribute('aria-selected',String(k===active));b.tabIndex=k===active?0:-1}const d=data.drafts.find(x=>x.id===active);document.querySelector('header h1').textContent=d?d.name:data.title;document.querySelector('header .eyebrow').textContent=d?`${d.id} · ${d.status}`:data.version;document.title=d?`${d.name} · Room 2 Layout`:data.title}
function panel(id,label){const b=el('button','tab',label,tabs);b.type='button';b.id='tab-'+id;b.setAttribute('role','tab');b.setAttribute('aria-controls','panel-'+id);b.addEventListener('click',()=>location.hash=id);const p=el('section','panel',undefined,root);p.id='panel-'+id;p.setAttribute('role','tabpanel');p.setAttribute('aria-labelledby',b.id);panels.set(id,p);buttons.set(id,b);return p}
const header=el('header','',undefined,root);el('div','eyebrow',data.version,header);el('h1','',data.title,header);el('p','',data.publicIntro,header);el('p','notice',data.disclaimer,header);root.prepend(header);root.insertBefore(tabs,header.nextSibling);const overview=panel('overview','Overview');const grid=el('div','overview-grid',undefined,overview);
function mini(d){const a=el('a','card',undefined,grid);a.href='#'+d.id;a.setAttribute('aria-label',`${d.name}, ${d.status}`);a.title=`${d.name} · ${d.status}`;const s=svgEl('svg',{viewBox:'0 0 100 130',role:'img','aria-label':d.name},a);drawGeometry(s,d,100,130,false)}
function drawGeometry(svg,d,w,h,labels){const g=d.geometry,pad=10,scale=Math.min((w-2*pad)/g.width,(h-2*pad)/g.height),ox=(w-g.width*scale)/2,oy=(h-g.height*scale)/2;svg.setAttribute('viewBox',`0 0 ${w} ${h}`);svgEl('rect',{x:ox,y:oy,width:g.width*scale,height:g.height*scale,fill:'#142833',stroke:'#dce8e5','stroke-width':Math.max(1,scale*.025)},svg);const rect=(r,cls)=>svgEl('rect',{x:ox+r.x*scale,y:oy+r.y*scale,width:r.width*scale,height:r.height*scale,class:cls},svg);if(!labels)g.hallRects.forEach(r=>rect(r,'hall-shape'));if(!labels)g.subhallRects.forEach(r=>rect(r,'hall-shape'));if(!labels)g.rooms.forEach(room=>room.rects.forEach(r=>rect(r,'room-shape')));if(!labels)g.wallsList.forEach(r=>rect(r,'wall-shape'));if(labels){const m=svgEl('g',{class:'layer-measurements'},svg);svgEl('line',{x1:ox,y1:oy-4,x2:ox+g.width*scale,y2:oy-4,class:'measure-line'},m);svgEl('text',{x:ox+g.width*scale/2,y:oy-6,class:'measure-text','text-anchor':'middle'},m,`${g.width.toFixed(2)} m × ${g.height.toFixed(2)} m`);svg.dataset.scale=scale;svg.dataset.ox=ox;svg.dataset.oy=oy}}
data.drafts.forEach(d=>mini(d));
function detail(d){const p=panel(d.id,d.name);el('h2','',d.name,p);el('span','draft-status',d.status,p);el('p','brief',d.brief,p);const config=el('div','config',undefined,p);const fields=[['Gross area',`${d.config.grossArea} m²`],['Shell ratio',d.config.shellRatio],['Wall thickness',`${d.config.wallThickness} m`],['Main hallway width',`${d.config.mainHallwayWidth} m`],...(d.config.subhallwayWidth?[['Sub-hallway width',`${d.config.subhallwayWidth} m`]]:[]),['Room count',d.config.roomCount],['Circulation',d.config.circulation],['Shell dimensions',`${d.config.shellDimensions.width.toFixed(2)} × ${d.config.shellDimensions.height.toFixed(2)} m`]];fields.forEach(([label,value])=>{const f=el('div','field',undefined,config);el('span','',label,f);el('strong','',String(value),f)});const workspace=el('div','workspace',undefined,p),fig=el('figure','plan',undefined,workspace),svg=svgEl('svg',{viewBox:'0 0 800 640',role:'img','aria-label':`${d.name} measured plan`},fig);drawGeometry(svg,d,800,640,true);const layers=el('aside','layers',undefined,workspace);el('h3','', 'Display layers',layers);[['measurements','Measurements'],['rooms','Rooms'],['main','Main hallway'],['sub','Sub-hallway'],['walls','Walls']].forEach(([key,label])=>{const l=el('label','',undefined,layers),i=el('input','',undefined,l);i.type='checkbox';i.checked=true;const g=svgEl('g',{class:`layer-${key}`},svg);if(key==='measurements'){const group=svg.querySelector('.layer-measurements');g.append(...group.childNodes);group.remove()}else{const source=key==='rooms'?d.geometry.rooms.flatMap(r=>r.rects):key==='main'?d.geometry.hallRects:key==='sub'?d.geometry.subhallRects:d.geometry.wallsList;source.forEach(r=>svgEl('rect',{x:Number(svg.dataset.ox)+r.x*Number(svg.dataset.scale),y:Number(svg.dataset.oy)+r.y*Number(svg.dataset.scale),width:r.width*Number(svg.dataset.scale),height:r.height*Number(svg.dataset.scale),class:key==='rooms'?'room-shape':key==='walls'?'wall-shape':'hall-shape'},g))}i.addEventListener('change',()=>g.hidden=!i.checked);l.append(document.createTextNode(label))});const areas=el('div','areas',undefined,p);[['Combined rooms',d.metrics.combinedRooms],['Main hallway',d.metrics.mainHall],['Sub-hallway',d.metrics.subHall],['Combined halls',d.metrics.combinedHalls],['Walls',d.metrics.walls],['Total',d.metrics.total],['Difference',d.metrics.difference]].forEach(([label,value])=>{const a=el('div','area',undefined,areas);el('span','',label,a);el('strong','',`${value.toFixed(3)} m²`,a)});const report=el('section','report',undefined,p);el('h3','','Per-room area report',report);const list=el('ul','',undefined,report);d.metrics.roomAreas.forEach(r=>el('li','',`${r.id}: ${r.area.toFixed(3)} m²`,list));d.warnings.forEach(w=>el('p','warning',w,p));const details=el('details','',undefined,p);el('summary','','Assumptions',details);const ul=el('ul','',undefined,details);d.assumptions.forEach(a=>el('li','',a,ul));el('footer','',data.disclaimer,p)}
data.drafts.forEach(detail);const footer=el('footer','',data.disclaimer,root);function navigate(){select(decodeURIComponent(location.hash.slice(1))||'overview')}window.addEventListener('hashchange',navigate);navigate()})();
</script></body></html>
